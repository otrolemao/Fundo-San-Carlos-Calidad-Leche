<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Control de pH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Estilos específicos para centrar el login */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        .login-card h1 {
            font-family: var(--font-geist-mono);
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--color-bone);
            text-align: center;
            margin-bottom: 30px;
        }
        .login-card h1 i {
            color: var(--color-signal-orange);
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <h1><i class="fas fa-cow"></i> San Carlos</h1>
        <form id="form-login">
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="admin@fundosancarlos.cl">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••">
            </div>
            <button type="submit" class="btn-guardar">
                <i class="fas fa-sign-in-alt"></i> INGRESAR
            </button>
        </form>
        <div id="mensaje-login" class="mensaje"></div>
    </div>

    <script src="login.js"></script>
</body>
</html>
