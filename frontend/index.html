<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calidad de Leche - Fundo San Carlos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- SCRIPT DE PROTECCIÓN DE SESIÓN -->
    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>
    <header>
        <div class="logo">
            <i class="fas fa-cow"></i> Fundo San Carlos - Control de pH
        </div>
        <!-- NUEVO: Botón de Cerrar Sesión -->
        <button id="btn-logout" style="background: none; border: 1px solid var(--color-ash-stroke); color: var(--color-warm-granite); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: var(--font-geist-mono); font-size: 11px;">
            <i class="fas fa-sign-out-alt"></i> SALIR
        </button>
    </header>

    <main class="container">
        <!-- Formulario de Registro -->
        <section class="card">
            <h2><i class="fas fa-flask"></i> Registrar Nueva Muestra</h2>
            <form id="form-muestra">
                <div class="input-group">
                    <label for="valor_ph">Valor de pH:</label>
                    <input type="number" id="valor_ph" step="0.1" min="0" max="14" required placeholder="Ej: 6.8">
                </div>
                <div class="input-group">
                    <label for="temperatura">Temperatura (°C):</label>
                    <input type="number" id="temperatura" step="0.1" placeholder="Ej: 4.0">
                </div>
                <div class="input-group">
                    <label for="volumen_litros">Volumen (Litros):</label>
                    <input type="number" id="volumen_litros" step="0.1" min="0" required placeholder="Ej: 1000">
                </div>
                
                <!-- IDs de prueba (dejamos los que creamos en la BD) -->
                <input type="hidden" id="lote_id" value="a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11">
                <input type="hidden" id="registrado_por" value="a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11">
                
                <button type="submit" class="btn-guardar"><i class="fas fa-save"></i> Guardar Muestra</button>
            </form>
            <div id="mensaje" class="mensaje"></div>
        </section>

        <!-- Tabla de Historial -->
        <section class="card">
            <h2><i class="fas fa-list"></i> Historial de Calidad</h2>
            <button id="btn-actualizar" class="btn-actualizar"><i class="fas fa-sync-alt"></i> Actualizar Datos</button>
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>pH</th>
                        <th>Temp (°C)</th>
                        <th>Litros</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-muestras">
                    <tr>
                        <td colspan="5">Cargando datos...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        // Lógica para el botón de cerrar sesión
        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('rol');
            localStorage.removeItem('nombre');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
